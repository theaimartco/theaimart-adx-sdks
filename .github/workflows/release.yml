name: Release

# One tag per registry, so each SDK ships on its own schedule:
#
#   python-v1.1.0        → PyPI       theaimart-adx                (Trusted Publishing, OIDC)
#   node-v1.1.0          → npm        @theaimart/adx               (Trusted Publishing, OIDC + provenance)
#   web-v1.1.0           → npm        @theaimart/adx-web           (Trusted Publishing, OIDC + provenance)
#   react-native-v1.1.0  → npm        @theaimart/adx-react-native  (Trusted Publishing, OIDC + provenance)
#   rust-v1.1.0          → crates.io  theaimart-adx                (Trusted Publishing, OIDC)
#   flutter-v1.1.0       → pub.dev    theaimart_adx                (automated publishing, OIDC)
#   android-v1.1.0       → Maven Central co.theaimart:adx-android  (Central Portal upload, GPG-signed)
#   v1.1.0               → SwiftPM + Unity UPM resolve the tag itself; CocoaPods trunk push
#
# Nobody has to push these tags by hand: `auto-release.yml` creates them when a package's
# version changes on main and starts this workflow for each one. Pushing a tag yourself still
# works exactly as before.
#
# Every job refuses to publish unless the tag's version is the version the package reports on
# the wire (scripts/check-versions.mjs), and runs the package's tests first.
#
# One-time registry setup (outside this file) — RELEASING.md walks through each one:
# register this repository + workflow `release.yml` as a trusted publisher on PyPI, npm (each
# package), crates.io and pub.dev (tag pattern `flutter-v{{version}}`, with publishing from
# workflow_dispatch allowed), each behind a GitHub environment of the same name. npm cannot
# trust a package that does not exist yet, so the first publish of a new npm package uses the
# NPM_TOKEN secret. Maven Central needs MAVEN_CENTRAL_USERNAME / MAVEN_CENTRAL_PASSWORD /
# MAVEN_GPG_PRIVATE_KEY / MAVEN_GPG_PASSPHRASE in the `maven-central` environment, and
# CocoaPods needs COCOAPODS_TRUNK_TOKEN in the `cocoapods` environment.

on:
  push:
    tags:
      - "python-v*"
      - "node-v*"
      - "web-v*"
      - "react-native-v*"
      - "rust-v*"
      - "flutter-v*"
      - "android-v*"
      - "v*"
  # How auto-release.yml starts a release: a tag pushed with the workflow's own token cannot
  # trigger another workflow, so it dispatches this one on the tag instead. Run it from the
  # Actions tab with "Use workflow from" set to a tag to re-run a failed release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.tag.outputs.package }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::run this workflow on a release tag (e.g. web-v1.1.0), not on a branch"
            exit 1
          fi
          case "$TAG" in
            python-v*)       pkg=python ;;
            node-v*)         pkg=node ;;
            web-v*)          pkg=web ;;
            react-native-v*) pkg=react-native ;;
            rust-v*)         pkg=rust ;;
            flutter-v*)      pkg=flutter ;;
            android-v*)      pkg=android ;;
            v*)              pkg=ios ;;
            *) echo "unrecognised tag $TAG"; exit 1 ;;
          esac
          version="${TAG##*v}"
          node scripts/check-versions.mjs
          # The tagged version must be exactly what the package reports on the wire.
          node scripts/check-versions.mjs | grep -Eq "^✓ ${pkg} +${version//./\\.}\$" \
            || { echo "tag $TAG does not match the ${pkg} package version"; exit 1; }
          if [ "$pkg" = ios ]; then
            node scripts/check-versions.mjs | grep -Eq "^✓ unity +${version//./\\.}\$" \
              || { echo "tag $TAG does not match the unity package version"; exit 1; }
          fi
          echo "package=$pkg" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  python:
    needs: plan
    if: needs.plan.outputs.package == 'python'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"
      - run: python -m pip install --upgrade build twine mypy
      - run: PYTHONPATH=src python -m unittest discover -s tests
        working-directory: packages/python
      - run: python -m mypy
        working-directory: packages/python
      - run: python -m build && python -m twine check dist/*
        working-directory: packages/python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/python/dist/

  npm:
    needs: plan
    if: contains(fromJSON('["node","web","react-native"]'), needs.plan.outputs.package)
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/${{ needs.plan.outputs.package }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted Publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - run: npm install -g npm@11
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx tsc -p tsconfig.json --noEmit
      - run: node --test test/*.test.ts
      - run: npm audit --omit=dev --audit-level=low
      - if: needs.plan.outputs.package == 'web'
        run: npm rebuild esbuild
      # prepublishOnly builds dist/ (and the CDN bundle for web); provenance links the tarball
      # to this workflow run. Trusted Publishing (OIDC) is used when npm trusts this repo;
      # NPM_TOKEN covers a package's very first publish, before npm can trust anything.
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  rust:
    needs: plan
    if: needs.plan.outputs.package == 'rust'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/rust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - run: cargo test --all-features
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo install cargo-audit --locked && cargo audit
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  flutter-test:
    needs: plan
    if: needs.plan.outputs.package == 'flutter'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/flutter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
      - run: flutter pub get && flutter analyze && flutter test
      - run: dart pub publish --dry-run

  flutter:
    needs: [plan, flutter-test]
    if: needs.plan.outputs.package == 'flutter'
    permissions:
      id-token: write
    # pub.dev's own reusable workflow: it is what pub.dev's automated publishing trusts.
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
    with:
      environment: pub.dev
      working-directory: packages/flutter

  cocoapods:
    needs: plan
    if: needs.plan.outputs.package == 'ios'
    runs-on: macos-latest
    environment: cocoapods
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: swift test
        working-directory: packages/ios
      - run: swift package describe
      # SwiftPM and Unity install straight from the git tag, so the release has already
      # happened for them by the time this runs. Without the trunk token, skip CocoaPods with
      # a notice instead of turning a successful release red.
      - name: Push to CocoaPods trunk
        env:
          COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
        run: |
          if [ -z "$COCOAPODS_TRUNK_TOKEN" ]; then
            echo "::notice::COCOAPODS_TRUNK_TOKEN is not set — skipped CocoaPods. SwiftPM and Unity install from this tag already."
            exit 0
          fi
          pod trunk push TheaimartAdx.podspec --allow-warnings

  android:
    needs: plan
    if: needs.plan.outputs.package == 'android'
    runs-on: ubuntu-latest
    environment: maven-central
    defaults:
      run:
        working-directory: packages/android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: gradle :adx:testDebugUnitTest :adx:publishReleasePublicationToStagingRepository --console=plain
      - name: Sign and upload to Maven Central
        working-directory: .
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: scripts/publish-maven-central.sh
